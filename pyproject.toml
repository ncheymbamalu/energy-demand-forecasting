[project]
name = "energy-demand-forecasting"
version = "0.1.0"
description = "End-to-end project for forecasting hourly energy demand"
readme = "README.md"
requires-python = "==3.12.11"
dependencies = [
    "dvc>=3.67.1",
    "dvc-gdrive>=3.0.1",
    "hyperopt>=0.3.0",
    "lightgbm>=4.7.0",
    "loguru>=0.8.0",
    "numpy==1.26.4",
    "omegaconf>=2.3.1",
    "polars==1.41.2",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "scikit-learn==1.2.2",
    "statsmodels>=0.15.0",
    "tqdm>=4.70.1",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "ipywidgets>=8.1.9",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "plotly>=7.1.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "ty>=0.0.104",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["energy_demand_forecasting"]
combine-as-imports = true
force-wrap-aliases = true
lines-after-imports = 2

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
